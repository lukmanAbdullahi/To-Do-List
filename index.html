<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <!-- Add Task -->
        <form id="taskForm">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >

            <button type="submit">
                Add Task
            </button>

        </form>


        <!-- Filters -->
        <div class="filters">

            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="active">
                Active
            </button>

            <button class="filter" data-filter="completed">
                Completed
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"></ul>


        <!-- Footer -->
        <div class="footer">

            <span id="taskCount">
                0 tasks left
            </span>

            <button id="clearCompleted">
                Clear Completed
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
